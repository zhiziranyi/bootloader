; PlatformIO Project Configuration File - FlashSafe Pro Bootloader
;
; STM32F407ZGT6 - sector-aligned 128KB Bootloader with OTA + ECDSA verification

[env:black_f407zg]
platform = ststm32
board = black_f407zg
framework = stm32cube

; Custom linker script for sectors 0-4 (128KB bootloader partition)
board_build.ldscript = $PROJECT_DIR/STM32F407ZGTx_BOOTLOADER.ld

; Compiler flags - optimize for size
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--relax
    -DUSE_HAL_DRIVER
    -DSTM32F4
    -DSTM32F407xx
    -DSTM32F40_41xxx
    -DHSE_VALUE=8000000
    -DBOOTLOADER_BUILD
    -DMBEDTLS_CONFIG_FILE='"mbedtls_config.h"'
    -I $PROJECT_DIR/include
    -I $PROJECT_DIR/lib/lwip/src/include
    -I $PROJECT_DIR/network
    -I $PROJECT_DIR/lib/mbedtls/include
    -I $PROJECT_DIR/lib/mbedtls/include/mbedtls

; STM32 ROM bootloader upload through a 3.3 V USB-to-TTL adapter.
; The port follows the working CANopen project configuration.
upload_protocol = serial
upload_speed = 115200
upload_port = COM3
board_upload.offset_address = 0x08000000
custom_upload_length = 131072
extra_scripts = post:$PROJECT_DIR/tools/stm32_serial_offset.py

; Build type
build_type = release

; Source filter - include network and LWIP
build_src_filter = +<*> -<.git/> -<.svn/> -<lib/>
    +<../lib/lwip/src/core/*.c>
    +<../lib/lwip/src/core/ipv4/*.c>
    +<../lib/lwip/src/netif/*.c>
    +<../lib/lwip/src/netif/etharp.c>
    +<../network/*.c>

; Extra library directories (mbedTLS)
lib_extra_dirs = lib

; Library dependencies
lib_deps =
    lwip
